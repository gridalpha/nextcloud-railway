; Runs Apache and Nextcloud's cron in one container, because Railway volumes cannot
; be shared between two services. Adapted from nextcloud/docker's own
; .examples/dockerfiles/cron/apache/supervisord.conf.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord/supervisord.pid
childlogdir=/var/log/supervisord/
loglevel=info

[program:apache2]
command=apache2-foreground
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
priority=10

[program:cron]
; /cron.sh is busybox crond running the image's own crontab:
;   */5 * * * * php -f /var/www/html/cron.php
command=/cron.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
priority=20
